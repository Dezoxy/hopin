name: Docs / Consistency

# The mechanical half of the /docs-sync audit, plus Structurizr validation of
# the architecture model, Markdown lint and secret scanning. Runs on every
# pull request and on main. Read-only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: docs consistency
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Check documentation against the tree
        run: make docs

  model:
    name: architecture model
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Same pinned image as local runs (Makefile STRUCTURIZR_IMAGE).
      - name: Validate and inspect the Structurizr workspace
        run: make check

  markdown:
    name: markdown lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Lint Markdown (config in .markdownlint.json)
        uses: DavidAnson/markdownlint-cli2-action@v20

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Full history: gitleaks scans every commit, not only the tree.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
