# Local dependencies for the slice. Development-only credentials.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hopin_admin
      POSTGRES_PASSWORD: hopin-local-admin
      POSTGRES_DB: hopin
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hopin_admin -d hopin"]
      interval: 2s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20
